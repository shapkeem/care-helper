name: build-cs

# C#판 맞춤돌봄도우미. 손으로 실행할 때만 돈다. release=true 일 때만 GitHub 릴리스를 만든다 (기본은 빌드 결과만 올림).
on:
  workflow_dispatch:
    inputs:
      release:
        description: "GitHub 릴리스 만들기 (직원 PC 업데이트 버튼에 뜸)"
        type: boolean
        default: false
      prerelease:
        description: "시험판으로 올리기 (직원 PC 업데이트 버튼에 안 뜸)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: 시험
        run: dotnet test csharp/CareHelper.Tests -c Release
      - name: 빌드 (폴더째, .NET 포함)
        shell: pwsh
        run: |
          $ver = (Select-String -Path "csharp/CareHelper.Core/AppInfo.cs" -Pattern 'AppVersion = "(.+)"').Matches[0].Groups[1].Value
          echo "VER=$ver" >> $env:GITHUB_ENV
          dotnet publish csharp/CareHelper.App -c Release -r win-x64 --self-contained true -p:PublishReadyToRun=true -o out/맞춤돌봄도우미
          # 연결 exe: 파이썬판 업데이트 버튼이 받는 것 + C#판이 켤 때 예전 자리의 연결 exe 를 바꿔 끼우는 데 쓰도록 폴더에도 넣는다
          dotnet build csharp/CareHelper.Bridge -c Release -p:Version=$ver
          Copy-Item csharp/CareHelper.Bridge/bin/Release/net48/CareHelperBridge.exe out/맞춤돌봄도우미/CareHelperBridge.exe
          # Compress-Archive 는 한글 파일 이름이 깨질 수 있어 파이썬 zipfile 로 묶는다 (UTF-8 이름)
          python -c "import zipfile,os,sys;z=zipfile.ZipFile(sys.argv[1],'w',zipfile.ZIP_DEFLATED);[z.write(os.path.join(r,f),os.path.relpath(os.path.join(r,f),'out').replace(os.sep,'/')) for r,_,fs in os.walk('out/맞춤돌봄도우미') for f in fs];z.close()" "CareHelper-$ver-win-x64.zip"
          Copy-Item csharp/CareHelper.Bridge/bin/Release/net48/CareHelperBridge.exe "CareHelper-$ver.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: CareHelper-${{ env.VER }}-win-x64
          path: |
            CareHelper-${{ env.VER }}-win-x64.zip
            CareHelper-${{ env.VER }}.exe
      - name: 릴리스
        if: ${{ inputs.release }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $pre = @()
          if ("${{ inputs.prerelease }}" -eq "true") { $pre = @("--prerelease") }
          gh release create "v$env:VER" "CareHelper-$env:VER-win-x64.zip" "CareHelper-$env:VER.exe" --title "v$env:VER (C#판)" --notes "C#판 맞춤돌봄도우미. 파이썬판에서는 업데이트 버튼을 누르면 자동으로 넘어옵니다. 새로 설치할 때는 CareHelper-버전.exe 하나만 받아 실행하면 됩니다." --target "$env:GITHUB_SHA" @pre
