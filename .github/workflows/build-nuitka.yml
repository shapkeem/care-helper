name: Nuitka 시험 빌드

# 배포(릴리스)는 하지 않고 exe 를 다운로드 파일(artifact)로만 남긴다
on:
  workflow_dispatch:
  push:
    branches: ["nuitka-test"]

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 패키지 설치
        run: pip install nuitka ordered-set zstandard playwright openpyxl xlrd
      - name: exe 빌드 (Nuitka)
        shell: pwsh
        run: |
          $ver = (Select-String -Path "맞춤돌봄도우미.py" -Pattern '^APP_VERSION = "(.+)"').Matches[0].Groups[1].Value
          echo "VER=$ver" >> $env:GITHUB_ENV
          Set-Content -Path _build_flags.py -Value 'UI = "tk"' -Encoding utf8
          $drv = python -c "import playwright, os; print(os.path.join(os.path.dirname(playwright.__file__), 'driver'))"
          python -m nuitka --onefile --assume-yes-for-downloads --msvc=latest `
            --windows-console-mode=disable --windows-icon-from-ico=icon.ico `
            --company-name=CareHelper --product-name=CareHelper --file-description=CareHelper `
            --file-version=$ver --product-version=$ver `
            --onefile-tempdir-spec="{CACHE_DIR}/CareHelper/{VERSION}" `
            --include-data-files=icon.ico=icon.ico `
            --include-module=_build_flags --include-module=tkui --include-module=webui --include-module=kakao_ui --include-module=plan_converter --include-module=scare_plan `
            --include-module=kakao --include-module=kakao_job --include-module=runner --include-module=goodeos_work --include-module=jev `
            --include-package=playwright --include-data-dir="$drv=playwright/driver" `
            --nofollow-import-to=webview `
            --enable-plugin=tk-inter `
            --output-dir=dist --output-filename="CareHelper-$ver-nuitka.exe" `
            "맞춤돌봄도우미.py"
      - uses: actions/upload-artifact@v4
        with:
          name: CareHelper-${{ env.VER }}-nuitka
          path: dist/CareHelper-${{ env.VER }}-nuitka.exe
