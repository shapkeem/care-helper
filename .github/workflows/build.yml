name: Windows 빌드

on:
  workflow_dispatch:
    inputs:
      release:
        description: "빌드한 exe로 v<APP_VERSION> 릴리스 만들기"
        type: boolean
        default: false
  push:
    branches: ["claude/**"]
    paths: ["*.py", "ui/**", "icon.ico", ".github/workflows/build.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 패키지 설치
        run: pip install pyinstaller playwright pywebview openpyxl xlrd
      - name: exe 빌드
        shell: pwsh
        run: |
          $ver = (Select-String -Path "맞춤돌봄도우미.py" -Pattern '^APP_VERSION = "(.+)"').Matches[0].Groups[1].Value
          echo "VER=$ver" >> $env:GITHUB_ENV
          pyinstaller --onefile --windowed --noconfirm --icon icon.ico --add-data "icon.ico;." --add-data "ui;ui" `
            --collect-all webview --hidden-import webui --hidden-import kakao_ui --hidden-import plan_converter --hidden-import scare_plan `
            --name "CareHelper-$ver" "맞춤돌봄도우미.py"
      - uses: actions/upload-artifact@v4
        with:
          name: CareHelper-${{ env.VER }}
          path: dist/CareHelper-${{ env.VER }}.exe
      - name: 릴리스 만들기 (수동 실행에서 release 를 켰을 때)
        if: inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER }}
          target_commitish: ${{ github.sha }}
          name: v${{ env.VER }}
          body_path: RELEASE_NOTES.md
          files: dist/CareHelper-${{ env.VER }}.exe
